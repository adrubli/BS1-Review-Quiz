<title>Strategy Review Quiz</title>
<script>
/* =====================================================================
   1) FIREBASE CONFIG — paste the values Firebase gives you here.
      (Firebase console → Project settings → Your apps → Web app → "SDK setup and configuration" → Config)
      (Add ?demo=1 to the address to test in demo mode without Firebase.)
   ===================================================================== */
window.QUIZ_CONFIG = {
  apiKey: "AIzaSyB4f0_FPfMQC6UbrWILH8IZcbBXj_INLM4",
  authDomain: "strategy-final-review.firebaseapp.com",
  databaseURL: "https://strategy-final-review-default-rtdb.firebaseio.com",
  projectId: "strategy-final-review",
  storageBucket: "strategy-final-review.firebasestorage.app",
  messagingSenderId: "222226799159",
  appId: "1:222226799159:web:b250fdd7f835412c7d3db2"
};

/* 2) TITLE shown on the projector and phones */
window.QUIZ_TITLE = "Business Strategy — Final Exam Review";

/* 3) QUESTIONS — q: question (HTML allowed, \n = new line), opts: 4 options, ans: index of correct option (0=A, 1=B, 2=C, 3=D) */
window.QUIZ_QUESTIONS = [
  {"q":"In the supermarket market in Mexico, the opening of Amazon Fresh and Walmart’s expansion in e-commerce lead to:","opts":["No change in the threat of substitutes (street markets and local markets).","A decrease in the threat of complementary products.","A decrease in the bargaining power of food suppliers.","An increase in rivalry among existing competitors."],"ans":3},
  {"q":"A B2B (business to business) software company in Monterrey that sells perpetual licenses decides to move to a SaaS model (Software as a Service, which means customers pay a monthly subscription). The most strategically important change is:","opts":["Changing the key resources from human to physical resources.","Transforming the revenue streams and the value proposition.","Moving from digital channels to physical channels.","Eliminating the customer relationships block by automating service."],"ans":1},
  {"q":"A Mexican fintech offers credit to small and medium firms at similar interest rates as banks, but with approval times of 24 hours instead of weeks. Which statement best describes whether this fintech has a sustainable competitive advantage?","opts":["No, because the interest rates are similar and competitive advantage always requires a lower price.","Only if the ability to evaluate risk quickly is based on algorithms and data that are hard to copy.","Yes, because any improvement in response time automatically creates barriers to entry.","No, because banks can immediately copy the same response time."],"ans":1},
  {"q":"A software company in Guadalajara has highly talented programmers, but turnover is high (this means that they leave the job often) and there is no documentation of internal processes. The resource “individual talent” in this context is likely:","opts":["Valuable and well optimized, so it creates a sustained advantage.","Valuable but not optimized, so the firm captures little of that value.","Rare but not costly to imitate, so it guarantees a sustained advantage.","Not valuable, because all competitors surely have the same talent."],"ans":1},
  {"q":"A Mexican coffee shop chain has strategic locations in university areas and long-term rental contracts with preferential prices. The resource “long-term contracts in prime locations” is especially:","opts":["Irrelevant, because only coffee quality creates advantage.","Costly to imitate and valuable, potentially a source of sustained advantage if the organization is aligned.","Not rare, because any coffee shop can get this at no cost.","Socially complex and therefore hard to imitate in the short term, but not very valuable."],"ans":1},
  {"q":"A global beverage company in Mexico uses big data to optimize the product assortment for each store (this means the variety of products sold) and the shelf placement in every Oxxo. This investment in analytics is classified in the value chain mainly as:","opts":["Technology development that supports logistics and marketing.","Human resource management in outbound operations.","General infrastructure, but without impact on primary activities.","Primary operations for after-sales service."],"ans":0},
  {"q":"Oxxo launches its own digital wallet (Spin by Oxxo) and allows payments and money transfers through the app. In the business model, this represents mainly:","opts":["An extension of the value proposition and a new potential revenue stream.","A new customer segment, but it does not change the value proposition.","A change only in the cost structure due to technology investment.","A change only in the network of key partners (banks and payment processors)."],"ans":0},
  {"q":"A delivery platform in Mexico City gets high-demand restaurants to accept exclusivity in exchange for detailed customer data and advanced analytics. What is the main source of competitive advantage in this case?","opts":["Privileged access to data and lock-in with key restaurants.","Vertical integration into food production.","Economies of scale in physical distribution centers.","Bargaining power over independent couriers."],"ans":0},
  {"q":"A Mexican auto-parts company makes many products including batteries. The firm decides to buy a lithium mine in Sonora to secure the supply of raw materials for these batteries. This decision is:","opts":["Horizontal integration into new products.","Forward vertical integration.","Horizontal integration into new geographic markets.","Backward vertical integration."],"ans":3},
  {"q":"A Mexican conglomerate that already operates supermarkets decides to enter the car-insurance business. There are few operational synergies and few shared capabilities between both businesses. This move is:","opts":["Vertical integration toward suppliers.","Horizontal integration that leads to unrelated diversification.","Vertical integration based on shared capabilities, even if there are few.","Horizontal integration with direct competitors."],"ans":1},
  {"q":"A global beverage company operating in Mexico faces:\n- Greater social concern about obesity and health.\n- New taxes on sugar.\n- New technologies for producing low-calorie drinks.\nFrom an overall strategic perspective, the most consistent response would be:","opts":["Raise prices on all sugary products because the increase in costs is given mainly by the government's decision, not by a change in suppliers.","Reduce investment in R&D and focus only on traditional marketing to compensate for the tax increase.","Introduce healthy product lines, acquire startups of healthy drinks, and reposition the value proposition.","Change only sugar suppliers to reduce costs."],"ans":2},
  {"q":"The Mexican pharmaceutical market exceeds USD 12 billion. Generics represent about 85% of volume but only about 55% of value (this is because they sell at a lower price). The government regulator Cofepris has accelerated approvals, reducing review times from 5 years to under 12 months.\nFor a Mexican pharma company focused on innovative branded products, this mainly represents a:","opts":["Threat in OTC (over-the-counter) products but not in prescription drugs.","Opportunity to raise branded-product prices due to lower competitive pressures.","Regulatory threat that increases rivalry in generics and reduces differentiation.","All of the above."],"ans":2},
  {"q":"Mexico received 45 million international tourists in 2023, surpassing pre-pandemic levels. However, average spending per tourist fell from USD 620 to USD 540.\nFor a national high-end hotel company, this represents:","opts":["A threat because the market grows in volume but with lower willingness to pay, reducing premium revenues.","An opportunity to raise prices to compensate for lower demand for premium hotels.","An opportunity to expand into low-cost hotels.","A threat because there are more tourists."],"ans":0},
  {"q":"A Mexican industrial-software company has developed VRIO capabilities in predictive-maintenance solutions for manufacturing. It receives proposals from:\n(A) A non-equity strategic alliance with Siemens to join its marketplace as a partner.\n(B) A joint venture with a hardware company to create a new firm combining specialized sensors and the software.\n(C) Being acquired by a large global corporation.\nIf the owners' main goal is to maximize the value captured from their competitive advantage in the long run, which option is most strategically coherent (assuming they can execute it)?","opts":["Being acquired (C), because this always maximizes long-run value.","The non-equity alliance (A), because it allows scaling without losing control and without risk of losing future benefits.","The joint venture (B), if combining hardware and software creates strong synergies and keeps partial control of the VRIO advantage.","No strategic decision affects value capture as long as capabilities are VRIO."],"ans":2},
  {"q":"An ITAM student presented an analysis of the premium alcoholic-beverages industry. They included the following statement:<div class=\"quote\">New entrants benefit from changes in consumption because they can enter the industry with a sustainable, cultural, artisanal, and local focus. These trends aimed at B2B customers start to reduce barriers to entry; <u>however, producing these products requires a large investment to guarantee the quality demanded by the market.</u></div>How could you improve the accuracy of the statement that is underlined above?","opts":["Distinguish between fixed costs and variable costs for these products, and the expected demand, to understand the size and importance of the large initial investment.","Specify how elastic consumers are to product quality in this industry (that is, how much they respond to quality changes).","Explain under what conditions the large initial investment would actually be a barrier to entry.","All of these would be relevant to give greater accuracy to the statement."],"ans":3},
  {"q":"An ITAM student presented an analysis of the premium alcoholic-beverages industry. They included the following statement:<div class=\"quote\"><u>New entrants benefit from changes in consumption because they can enter the industry with a sustainable, cultural, artisanal, and local focus.</u> These trends aimed at B2B (business to business) customers start to reduce barriers to entry; however, producing these products requires a large investment to guarantee the quality demanded by the market.</div>How could you improve the accuracy of the statement that is underlined above?","opts":["Explain why a firm already in the industry would have a disadvantage in economies of scope when competing with the sustainable focus.","Explain how the bargaining power of firms in the industry does not allow them to create beverages with a cultural focus.","Explain the benefits that firms in the industry obtain from having the strength of a change in consumption patterns.","None of these would be valuable information to add to the statement."],"ans":0},
  {"q":"BYD is considering opening a new plant in Nuevo León to produce lithium batteries. The operations team makes the following predictions:\n(1) Unit costs will fall during the first 18 months, even though plant capacity usage stays constant at 40–50%.\n(2) Once operations stabilize, unit costs will only fall again when the plant operates close to maximum capacity for long periods.\n(3) Part of the production process developed for these batteries will help reduce costs in the production of electric motors, which happens in another division.\nBased on this information, what is the correct interpretation of this production technology?","opts":["Point (3) reflects learning curves, since learning to produce batteries allows the same experience to be applied directly to electric motors.","Points (1) and (2) indicate different things: the first is consistent with learning curves due to accumulated experience, while the second suggests economies of scale.","Taken together, points (1), (2), and (3) describe economies of scope, because producing different goods inside the same firm always generates reductions in average cost.","All of the above are correct interpretations."],"ans":1},
  {"q":"Spirit Airlines has achieved a substantial cost advantage compared to traditional airlines in U.S. domestic routes. What is the correct reasoning about its pricing strategy?","opts":["It should charge low prices because a cost advantage must always be used to follow a price-leadership strategy.","It should always match competitors’ prices to capture market share regardless of the customer segment.","It could charge prices similar to other airlines in the market if its target segment is not very price-sensitive and values airline loyalty programs.","None of the above is correct."],"ans":2},
  {"q":"The supermarket chain Comercial Mexicana uses an advanced analytics system to optimize inventories. The system is valuable, rare, and hard to imitate. To evaluate whether it generates a sustained advantage, what does the “O” in VRIO imply?","opts":["That the resource is formally incorporated into the corporate organization chart.","That the IT (information technology) department has enough staff to organize the software internally.","That the company has processes, incentives, and structures that allow it to use that resource effectively.","All of the above are direct implications of the “O” in VRIO."],"ans":2},
  {"q":"A startup wants to enter the mobile-telecommunications business in Mexico. An analyst says: “Since a lot of capital is required, then there is definitely a high barrier to entry.” What is the correct reasoning?","opts":["Yes, because companies already in the market can simply deny legal permission to any new player that does not have its own capital.","Yes, because whenever a lot of money is required to start, there is automatically a structural barrier to entry.","No, because capital-related entry barriers only exist in industries with proprietary technology, not when there is physical infrastructure.","Not necessarily; the barrier depends on whether investors believe the expected return justifies financing the entry."],"ans":3}
];
</script>
<style>
:root{--c0:#e21b3c;--c1:#1368ce;--c2:#d89e00;--c3:#26890c;--bg:#46178f;--ink:#1d1d1f;--card:#fff;--muted:#6b6b76}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(circle at 15% 20%,#5a2bab 0,transparent 40%),radial-gradient(circle at 85% 80%,#3a0f7a 0,transparent 45%)}
#app{min-height:100%;display:flex;flex-direction:column}
.card{background:var(--card);border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.25);margin:40px auto;width:min(640px,calc(100% - 24px))}
h1{margin:0 0 8px;font-size:2rem}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:#333;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.big{font-size:1.25rem;padding:16px 30px;background:var(--c3)}
.btn.small{padding:6px 12px;font-size:.9rem;background:var(--c1)}
.btn.ghost{background:#fff;color:#333;box-shadow:0 0 0 2px #ccc inset}
.btn:disabled{opacity:.5}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.setup label{display:block;margin:18px 0 0;font-weight:600}
.setup label.check{font-weight:400;display:flex;gap:8px;align-items:flex-start}
.setup input[type=text],.setup select,.phone input{display:block;width:100%;margin-top:6px;font:inherit;font-size:1.1rem;padding:12px;border:2px solid #ddd;border-radius:10px}
.setup .btn.big{margin-top:24px;width:100%}
.notice{background:#fff6dc;border:1px solid #f0d48a;padding:12px 14px;border-radius:10px;margin:14px 0}
.notice.ok{background:#e7f6e7;border-color:#9fd49f}
.demo-banner{background:#ffd400;color:#222;text-align:center;font-weight:700;padding:6px;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;z-index:9;max-width:90%}
.jump{font:inherit;padding:10px;border-radius:10px;border:2px solid #ccc;background:#fff}

/* lobby */
.lobby{flex:1;display:flex;gap:4vw;align-items:center;justify-content:center;padding:3vw}
.lobby-left .qr{background:#fff;border-radius:16px;padding:12px;width:min(42vw,72vh)}
.lobby-left .qr svg{width:100%;height:auto;display:block}
.lobby-right{color:#fff;max-width:46vw}
.lobby-right h1{font-size:2.6vw}
.lobby-right .muted{color:#d9ccf2;word-break:break-all}
.big-instr{font-size:2.2vw;font-weight:800;margin:.4em 0}
.url{font-family:ui-monospace,monospace;color:#fff}
.code-line{font-size:1.6vw}.code{background:#fff;color:var(--bg);font-weight:900;padding:2px 14px;border-radius:8px;letter-spacing:.12em;font-size:2.4vw}
.count{font-size:2vw;font-weight:800;margin-top:1.5vw}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:28vh;overflow:auto}
.chip{background:rgba(255,255,255,.95);color:#222;font-weight:700;padding:6px 12px;border-radius:999px;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* question / reveal (projector) */
.qscreen{flex:1;display:flex;flex-direction:column;padding:2vh 2.5vw;gap:2vh;font-size:clamp(16px,1.9vw,40px)}
.qscreen.long{font-size:clamp(15px,1.6vw,34px)}
.qscreen.xlong{font-size:clamp(14px,1.35vw,30px)}
.topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;gap:20px}
.qnum{background:rgba(255,255,255,.15);padding:.3em .8em;border-radius:999px}
.timer{min-width:2.6em;height:2.6em;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--bg);font-size:1.4em}
.timer:empty{visibility:hidden}
.timer.low{background:#ffd400}.timer.up{border-radius:999px;padding:0 .8em;font-size:1em;background:#ffd400}
.answered{background:rgba(255,255,255,.15);padding:.3em .8em;border-radius:999px}
.result{background:#fff;color:var(--ink);padding:.3em 1em;border-radius:999px;font-weight:500}
.qtext{background:#fff;border-radius:14px;padding:1em 1.2em;line-height:1.35;font-weight:600}
.qtext .quote{font-style:italic;font-weight:500;border-left:5px solid #ccc;padding:.2em 0 .2em .8em;margin:.4em 0}
.qtext u{text-decoration-thickness:2px;background:#fff3b0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1vw;flex:1}
.opt{border-radius:12px;color:#fff;padding:.7em 1em;display:flex;flex-direction:column;gap:.3em;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;transition:opacity .3s,transform .3s}
.opt .shape{font-weight:900;font-size:1.1em}
.opt .otext{line-height:1.3;font-weight:600}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.reveal .opt.wrong{opacity:.35}
.reveal .opt.correct{outline:6px solid #fff;transform:scale(1.015)}
.bar{display:flex;align-items:center;gap:.5em;margin-top:auto}
.bar .fill{height:.9em;background:rgba(255,255,255,.9);border-radius:6px;min-width:4px;transition:width .6s}
.bar .n{font-weight:900;font-size:1.2em}
.controls{display:flex;gap:12px;align-items:center;justify-content:flex-end;font-size:16px}
.controls .btn{font-size:1.15rem;background:#fff;color:var(--bg)}
.controls .btn.ghost{color:#555}
.hint{color:#cbbbe8;font-size:.85rem}

/* end */
.end{width:min(820px,calc(100% - 24px))}
.summary{display:grid;gap:6px;margin-top:16px}
.srow{display:grid;grid-template-columns:3em 1fr 3.5em 3.5em;gap:10px;align-items:center}
.sq{font-weight:800}.sp{font-weight:800;text-align:right}.sn{font-size:.85rem}
.sbar{background:#eee;border-radius:6px;height:16px;overflow:hidden}.sbar .fill{display:block;height:100%;background:var(--c3)}.sbar .fill.lowp{background:var(--c0)}

/* phone */
.phone{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;color:#fff}
.phone.card{min-height:0;color:var(--ink);margin-top:12vh}
.phone.card .btn.big{width:100%;margin-top:14px}
.phone h2{margin:.3em 0}
.phead{display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;background:rgba(0,0,0,.2)}
.pbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
.pbody .muted{color:#d9ccf2}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;flex:1;max-height:70vh}
.pbtns.withtext{grid-template-columns:1fr;max-height:none}
.pbtn{border:0;border-radius:14px;color:#fff;font:inherit;font-size:2.2rem;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.pbtns.withtext .pbtn{font-size:1.2rem;min-height:0;align-items:flex-start;text-align:left}
.ptext{font-size:.95rem;font-weight:600;line-height:1.25}
.pbtn:active{transform:translateY(3px)}
.ptimer{font-weight:900;font-size:1.3rem;min-height:1.4em}
.big-emoji{font-size:4rem}
.verdict{font-size:2rem;font-weight:900;padding:18px 26px;border-radius:14px}
.verdict.yes{background:var(--c3)}.verdict.no{background:var(--c0)}.verdict.none{background:#666}
.score{margin-top:14px;background:#fff;color:var(--bg);font-weight:900;padding:10px 18px;border-radius:999px;font-size:1.2rem}
.final{font-size:4rem;font-weight:900}
.err{color:var(--c0);font-weight:700}
.tiny{font-size:.8rem;text-align:center;margin-top:18px}.tiny a{color:var(--muted)}
</style>
</head>
